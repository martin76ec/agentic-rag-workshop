[project]
name = "agentic-rag-workshop"
version = "0.1.0"
description = "Infrastructure triage agent workshop using Mem0, LangGraph, and AgentOps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mem0ai>=0.1.0",
    "langgraph>=0.4.0",
    "langchain-ollama>=0.3.0",
    "ollama>=0.4.0",
    "langchain-core>=0.3.0",
    "agentops>=0.3.0",
    "qdrant-client>=1.12.0",
    "neo4j>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
