<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <defs>
    <style>
      text { font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      .g { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: step-start; }
      @keyframes k1  { 0%,2.4%   { opacity:0 } 2.5%,87.4%  { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k2  { 0%,5.7%   { opacity:0 } 5.8%,87.4%  { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k3  { 0%,9.1%   { opacity:0 } 9.2%,87.4%  { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k4  { 0%,14.9%  { opacity:0 } 15%,87.4%   { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k5  { 0%,20.7%  { opacity:0 } 20.8%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k6  { 0%,26.6%  { opacity:0 } 26.7%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k7  { 0%,31.6%  { opacity:0 } 31.7%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k8  { 0%,36.6%  { opacity:0 } 36.7%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k9  { 0%,41.6%  { opacity:0 } 41.7%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k10 { 0%,47.4%  { opacity:0 } 47.5%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      @keyframes k11 { 0%,54.1%  { opacity:0 } 54.2%,87.4% { opacity:1 } 87.5%,100% { opacity:0 } }
      .k1{animation-name:k1}  .k2{animation-name:k2}  .k3{animation-name:k3}
      .k4{animation-name:k4}  .k5{animation-name:k5}  .k6{animation-name:k6}
      .k7{animation-name:k7}  .k8{animation-name:k8}  .k9{animation-name:k9}
      .k10{animation-name:k10} .k11{animation-name:k11}
    </style>
  </defs>

  <!-- background -->
  <rect width="800" height="540" rx="10" fill="#1a1b26"/>

  <!-- title bar -->
  <rect width="800" height="30" rx="10" fill="#16161e"/>
  <rect y="20" width="800" height="10" fill="#16161e"/>
  <circle cx="20" cy="15" r="5.5" fill="#f7768e"/>
  <circle cx="40" cy="15" r="5.5" fill="#e0af68"/>
  <circle cx="60" cy="15" r="5.5" fill="#9ece6a"/>
  <text x="400" y="20" fill="#565f89" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace">make tui kafka-broker</text>
  <line x1="0" y1="30" x2="800" y2="30" stroke="#414868" stroke-width="0.5"/>

  <!-- k1: INCIDENT PANEL -->
  <g class="g k1">
    <rect x="10" y="36" width="780" height="73" fill="none" stroke="#f7768e" stroke-width="1" rx="3"/>
    <text x="18" y="53" font-size="12.5">
      <tspan fill="#c0caf5" font-weight="bold">  INC-001</tspan>
      <tspan fill="#565f89">   service: </tspan>
      <tspan fill="#7dcfff" font-weight="bold">kafka-broker</tspan>
      <tspan fill="#565f89">   severity: </tspan>
      <tspan fill="#f7768e" font-weight="bold">HIGH</tspan>
      <tspan fill="#565f89">   2.3s</tspan>
    </text>
    <text x="18" y="71" fill="#a9b1d6" font-size="12.5" font-style="italic">  kafka-broker returning 5xx. Consumer lag growing rapidly across services.</text>
    <text x="18" y="89" fill="#565f89" font-size="12.5">  symptoms: connection_refused, consumer_lag, message_backlog</text>
  </g>

  <!-- k2: TRIAGE AGENT -->
  <g class="g k2">
    <text x="18" y="122" font-size="12.5">
      <tspan fill="#e0af68" font-weight="bold">  &#x25CF; Triage Agent</tspan>
      <tspan fill="#565f89">  1.8s</tspan>
    </text>
  </g>

  <!-- k3: VECTOR SEARCH -->
  <g class="g k3">
    <text x="18" y="140" fill="#7dcfff" font-size="12.5">       &#x25B8; vector  &#xB7;  kafka message broker event streaming</text>
    <text x="18" y="158" font-size="12.5">
      <tspan fill="#565f89">         &#x2713;  kafka-broker          </tspan>
      <tspan fill="#9ece6a">0.94</tspan>
      <tspan fill="#565f89">  Kafka message broker, tier-1, data dept</tspan>
    </text>
    <text x="18" y="176" font-size="12.5">
      <tspan fill="#565f89">         &#x2713;  service-mesh          </tspan>
      <tspan fill="#9ece6a">0.71</tspan>
      <tspan fill="#565f89">  Service mesh: mTLS, inter-service routing</tspan>
    </text>
  </g>

  <!-- k4: GRAPH NEIGHBORHOOD -->
  <g class="g k4">
    <text x="18" y="194" fill="#bb9af7" font-size="12.5">       &#x25B8; graph  &#xB7;  neighborhood of kafka-broker</text>
    <text x="18" y="212" fill="#565f89" font-size="12.5">         kafka-broker  &#x2192;  service-mesh</text>
    <text x="18" y="230" fill="#565f89" font-size="12.5">         order-service  &#x2192;  kafka-broker  &#xB7;  payment-service  &#x2192;  kafka-broker</text>
    <text x="18" y="248" fill="#565f89" font-size="12.5">         [data  &#xB7;  tier 1]</text>
  </g>

  <!-- k5: GRAPH BLAST RADIUS -->
  <g class="g k5">
    <text x="18" y="266" fill="#bb9af7" font-size="12.5">       &#x25B8; graph  &#xB7;  blast radius from kafka-broker</text>
    <text x="18" y="284" fill="#565f89" font-size="12.5">         kafka-broker  &#x2192;  order-service  &#xB7;  kafka-broker  &#x2192;  payment-service</text>
    <text x="18" y="302" fill="#565f89" font-size="12.5">         5 services  &#xB7;  data, product, ml  &#xB7;  HIGH</text>
  </g>

  <!-- k6: LLM CLASSIFY -->
  <g class="g k6">
    <text x="18" y="320" fill="#e0af68" font-size="12.5">       &#x25B8; llm  &#xB7;  classify incident</text>
    <text x="18" y="338" fill="#565f89" font-size="12.5">         Tier-1 Kafka failure, data department, severity: HIGH</text>
  </g>

  <!-- k7: ROUTER AGENT -->
  <g class="g k7">
    <text x="18" y="362" font-size="12.5">
      <tspan fill="#7aa2f7" font-weight="bold">  &#x25CF; Router Agent</tspan>
      <tspan fill="#565f89">  0.1s   &#x2192;  data</tspan>
    </text>
  </g>

  <!-- k8: SPECIALIST HEADER -->
  <g class="g k8">
    <text x="18" y="386" font-size="12.5">
      <tspan fill="#9ece6a" font-weight="bold">  &#x25CF; Specialist [data]</tspan>
      <tspan fill="#565f89">  2.4s</tspan>
    </text>
  </g>

  <!-- k9: SPECIALIST VECTOR -->
  <g class="g k9">
    <text x="18" y="404" fill="#7dcfff" font-size="12.5">       &#x25B8; vector  &#xB7;  kafka data infrastructure runbooks escalation</text>
    <text x="18" y="422" font-size="12.5">
      <tspan fill="#565f89">         &#x2713;  data-knowledge        </tspan>
      <tspan fill="#9ece6a">0.89</tspan>
      <tspan fill="#565f89">  Data team owns Kafka, Postgres, Redis, ClickHouse</tspan>
    </text>
  </g>

  <!-- k10: SPECIALIST LLM -->
  <g class="g k10">
    <text x="18" y="440" fill="#e0af68" font-size="12.5">       &#x25B8; llm  &#xB7;  generating analysis</text>
    <text x="18" y="458" fill="#565f89" font-size="12.5">         kafka-broker tier-1 failure. 5 downstream services impacted across 3 depts</text>
  </g>

  <!-- k11: ANALYSIS PANEL -->
  <g class="g k11">
    <rect x="10" y="468" width="780" height="57" fill="none" stroke="#9ece6a" stroke-width="1" rx="3"/>
    <rect x="11" y="461" width="80" height="10" fill="#1a1b26"/>
    <text x="18" y="470" fill="#9ece6a" font-weight="bold" font-size="11"> analysis</text>
    <text x="18" y="486" fill="#c0caf5" font-size="12.5">  CRITICAL: kafka-broker tier-1 &#x2014; page data-oncall immediately</text>
    <text x="18" y="504" fill="#565f89" font-size="12.5">  Blast radius: 5 services &#xB7; data, product, ml &#xB7; check consumer lag, failover replicas</text>
  </g>
</svg>
